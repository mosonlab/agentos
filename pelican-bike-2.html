<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑车记 · 2D SVG 动画</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    min-height:100vh;
    display:grid;
    place-items:center;
    padding:28px 16px;
    background:linear-gradient(180deg,#e3eefb 0%,#f6fafd 100%);
    font-family:ui-sans-system,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  .stage{width:min(1100px,96vw)}
  h1{
    font-size:20px;font-weight:800;color:#1f2d3d;letter-spacing:.05em;margin-bottom:14px;
  }
  h1 small{font-weight:400;color:#7c8aa0;font-size:12px;letter-spacing:.08em;margin-left:10px}
  .card{
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 22px 55px rgba(50,90,140,.28), 0 2px 6px rgba(30,60,100,.08);
    border:1px solid rgba(255,255,255,.7);
  }
  svg{display:block;width:100%;height:auto}

  /* ---- 动画 ---- */
  .rider{animation:ride 18s linear infinite}
  @keyframes ride{
    from{transform:translateX(-430px)}
    to{transform:translateX(1560px)}
  }
  .spokes{animation:spin 5s linear infinite;transform-box:view-box}
  .crank{animation:spin 2.5s linear infinite;transform-box:view-box}
  @keyframes spin{to{transform:rotate(360deg)}}
  .rear-spokes{transform-origin:270px 380px}
  .front-spokes{transform-origin:530px 380px}
  .crank-anim{transform-origin:400px 380px}

  .pelican{animation:bob 1.25s ease-in-out infinite}
  @keyframes bob{
    0%,100%{transform:translateY(0)}
    25%{transform:translateY(-8px)}
    50%{transform:translateY(-3px)}
    75%{transform:translateY(-8px)}
  }
  .wing{animation:flap 1.25s ease-in-out infinite;transform-origin:400px 265px;transform-box:view-box}
  @keyframes flap{
    0%,100%{transform:rotate(-20deg)}
    25%{transform:rotate(15deg)}
    50%{transform:rotate(-20deg)}
    75%{transform:rotate(15deg)}
  }
  .rays{animation:rayspin 70s linear infinite;transform-origin:1035px 95px;transform-box:view-box}
  @keyframes rayspin{to{transform:rotate(360deg)}}

  .cloud1{animation:drift 36s linear infinite}
  .cloud2{animation:drift2 48s linear infinite}
  .cloud3{animation:drift3 60s linear infinite}
  @keyframes drift{from{transform:translateX(-260px)}to{transform:translateX(1500px)}}
  @keyframes drift2{from{transform:translateX(-560px)}to{transform:translateX(1200px)}}
  @keyframes drift3{from{transform:translateX(-360px)}to{transform:translateX(1400px)}}

  .birds{animation:fly 45s linear infinite}
  @keyframes fly{from{transform:translateX(-320px)}to{transform:translateX(-1120px)}}

  .dashes{animation:dashmove 2.4s linear infinite}
  @keyframes dashmove{to{transform:translateX(-120px)}}
</style>
</head>
<body>
<div class="stage">
  <h1>鹈鹕骑车记<small>PELICAN ON A BIKE · PURE SVG + CSS</small></h1>
  <div class="card">
    <svg viewBox="0 0 1200 600" role="img" aria-label="2D 动画：一只白色鹈鹕骑着自行车在草地上前进">
      <defs>
        <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#8ecbf5"/>
          <stop offset="70%" stop-color="#cde9fb"/>
          <stop offset="100%" stop-color="#e9f6ff"/>
        </linearGradient>
        <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#7cc24f"/>
          <stop offset="100%" stop-color="#55a13b"/>
        </linearGradient>
      </defs>

      <rect x="0" y="0" width="1200" height="600" fill="url(#skyGrad)"/>

      <!-- 太阳 -->
      <g>
        <g class="rays" stroke="#ffd93b" stroke-width="7" stroke-linecap="round">
          <line x1="1035" y1="49" x2="1035" y2="27"/>
          <line x1="1073.2" y1="56.8" x2="1083.1" y2="46.9"/>
          <line x1="1073.2" y1="95" x2="1083.1" y2="95"/>
          <line x1="1073.2" y1="133.2" x2="1083.1" y2="143.1"/>
        </g>
        <circle cx="1035" cy="95" r="46" fill="#ffe066" opacity="0.45"/>
        <circle cx="1035" cy="95" r="40" fill="#ffd93b"/>
      </g>

      <!-- 云朵 -->
      <g class="cloud1">
        <g transform="translate(280,100)" fill="#fff" opacity="0.95">
          <ellipse cx="0" cy="0" rx="46" ry="17"/>
          <circle cx="-24" cy="-9" r="18"/>
          <circle cx="2" cy="-15" r="23"/>
          <circle cx="26" cy="-8" r="17"/>
        </g>
      </g>
      <g class="cloud2">
        <g transform="translate(700,170)" fill="#fff" opacity="0.9">
          <ellipse cx="0" cy="0" rx="40" ry="15"/>
          <circle cx="-20" cy="-8" r="16"/>
          <circle cx="3" cy="-13" r="20"/>
          <circle cx="24" cy="-7" r="14"/>
        </g>
      </g>
      <g class="cloud3">
        <g transform="translate(1050,235)" fill="#fff" opacity="0.85">
          <ellipse cx="0" cy="0" rx="52" ry="18"/>
          <circle cx="-28" cy="-10" r="19"/>
          <circle cx="2" cy="-16" r="24"/>
          <circle cx="30" cy="-9" r="17"/>
        </g>
      </g>

      <!-- 飞鸟 -->
      <g class="birds">
        <g transform="translate(940,120)" stroke="#4a5a68" stroke-width="3.5" stroke-linecap="round" fill="none">
          <path d="M0 0 Q 9 -9 18 0 Q 27 -9 36 0"/>
        </g>
        <g transform="translate(1010,150) scale(0.6)" stroke="#5b6b7a" stroke-width="3.5" stroke-linecap="round" fill="none">
          <path d="M0 0 Q 9 -9 18 0 Q 27 -9 36 0"/>
        </g>
      </g>

      <!-- 远山 -->
      <ellipse cx="180" cy="560" rx="340" ry="150" fill="#a7d67e"/>
      <ellipse cx="1000" cy="590" rx="380" ry="170" fill="#99cf6f"/>

      <!-- 地面 -->
      <rect x="0" y="470" width="1200" height="130" fill="url(#groundGrad)"/>

      <!-- 道路 -->
      <rect x="0" y="470" width="1200" height="66" fill="#cdd6de"/>
      <line x1="0" y1="470" x2="1200" y2="470" stroke="#fff" stroke-width="2" opacity="0.55"/>
      <line x1="0" y1="536" x2="1200" y2="536" stroke="#9aa6b2" stroke-width="2" opacity="0.5"/>
      <g class="dashes">
        <g fill="#f4f6f8" opacity="0.9">
          <rect x="0" y="498" width="60" height="7" rx="3.5"/>
          <rect x="120" y="498" width="60" height="7" rx="3.5"/>
          <rect x="240" y="498" width="60" height="7" rx="3.5"/>
          <rect x="360" y="498" width="60" height="7" rx="3.5"/>
          <rect x="480" y="498" width="60" height="7" rx="3.5"/>
          <rect x="600" y="498" width="60" height="7" rx="3.5"/>
          <rect x="720" y="498" width="60" height="7" rx="3.5"/>
          <rect x="840" y="498" width="60" height="7" rx="3.5"/>
          <rect x="960" y="498" width="60" height="7" rx="3.5"/>
          <rect x="1080" y="498" width="60" height="7" rx="3.5"/>
        </g>
      </g>

      <!-- 骑车人与自行车（整体横穿画面） -->
      <g class="rider">
        <ellipse cx="400" cy="471" rx="215" ry="15" fill="rgba(70,50,20,0.2)"/>

        <!-- 后轮 -->
        <g>
          <circle cx="270" cy="380" r="90" fill="none" stroke="#26262e" stroke-width="13"/>
          <circle cx="270" cy="380" r="82" fill="none" stroke="#cfd8e0" stroke-width="5"/>
          <g class="spokes rear-spokes" stroke="#9aa8b5" stroke-width="5">
            <line x1="270" y1="290" x2="270" y2="470"/>
            <line x1="315" y1="457.9" x2="225" y2="302.1"/>
            <line x1="225" y1="457.9" x2="315" y2="302.1"/>
          </g>
          <circle cx="270" cy="380" r="9" fill="#26262e"/>
          <circle cx="270" cy="380" r="4" fill="#fff" opacity="0.35"/>
        </g>

        <!-- 前轮 -->
        <g>
          <circle cx="530" cy="380" r="90" fill="none" stroke="#26262e" stroke-width="13"/>
          <circle cx="530" cy="380" r="82" fill="none" stroke="#cfd8e0" stroke-width="5"/>
          <g class="spokes front-spokes" stroke="#9aa8b5" stroke-width="5">
            <line x1="530" y1="290" x2="530" y2="470"/>
            <line x1="575" y1="457.9" x2="485" y2="302.1"/>
            <line x1="485" y1="457.9" x2="575" y2="302.1"/>
          </g>
          <circle cx="530" cy="380" r="9" fill="#26262e"/>
          <circle cx="530" cy="380" r="4" fill="#fff" opacity="0.35"/>
        </g>

        <!-- 车架 -->
        <g stroke="#e5484d" stroke-width="9" stroke-linecap="round" fill="none">
          <line x1="400" y1="380" x2="400" y2="320"/>
          <line x1="400" y1="320" x2="400" y2="252"/>
          <line x1="400" y1="252" x2="505" y2="296"/>
          <line x1="400" y1="380" x2="505" y2="320"/>
          <line x1="505" y1="296" x2="505" y2="320"/>
          <line x1="400" y1="252" x2="270" y2="380"/>
          <line x1="400" y1="380" x2="270" y2="380"/>
          <line x1="505" y1="320" x2="530" y2="380"/>
        </g>
        <line x1="400" y1="380" x2="400" y2="255" stroke="#b9c2cc" stroke-width="7" stroke-linecap="round"/>
        <rect x="366" y="240" width="68" height="15" rx="8" fill="#2f333b"/>

        <!-- 车把 -->
        <g>
          <line x1="505" y1="296" x2="510" y2="272" stroke="#2f333b" stroke-width="8" stroke-linecap="round"/>
          <line x1="494" y1="268" x2="546" y2="268" stroke="#2f333b" stroke-width="8" stroke-linecap="round"/>
          <rect x="486" y="261" width="14" height="15" rx="5" fill="#2f333b"/>
          <rect x="540" y="261" width="14" height="15" rx="5" fill="#2f333b"/>
        </g>

        <!-- 车篮与鱼 -->
        <g>
          <rect x="508" y="278" width="40" height="26" rx="4" fill="#c98a4b"/>
          <g stroke="#a86c34" stroke-width="2" opacity="0.65">
            <line x1="518" y1="280" x2="518" y2="302"/>
            <line x1="528" y1="280" x2="528" y2="302"/>
            <line x1="538" y1="280" x2="538" y2="302"/>
            <line x1="510" y1="286" x2="546" y2="286"/>
            <line x1="510" y1="296" x2="546" y2="296"/>
          </g>
          <path d="M 513 256 l -11 -8 l 4 8 l -4 8 z" fill="#ff7a33"/>
          <ellipse cx="529" cy="260" rx="13" ry="8" fill="#ff8c42" transform="rotate(-18 529 260)"/>
          <circle cx="536" cy="257" r="1.6" fill="#fff"/>
        </g>

        <!-- 曲柄组（含双腿与脚踏） -->
        <g class="crank crank-anim">
          <line x1="400" y1="372" x2="401" y2="324" stroke="#f6a875" stroke-width="11" stroke-linecap="round"/>
          <line x1="400" y1="372" x2="401" y2="434" stroke="#df8a52" stroke-width="11" stroke-linecap="round"/>
          <line x1="400" y1="380" x2="401" y2="323" stroke="#26262e" stroke-width="8" stroke-linecap="round"/>
          <line x1="400" y1="380" x2="401" y2="437" stroke="#26262e" stroke-width="8" stroke-linecap="round"/>
          <rect x="383" y="316" width="36" height="13" rx="5" fill="#3a3f47"/>
          <rect x="383" y="428" width="36" height="13" rx="5" fill="#3a3f47"/>
          <ellipse cx="401" cy="322.5" rx="16" ry="10" fill="#f6a875" stroke="#e09055" stroke-width="2"/>
          <ellipse cx="401" cy="434.5" rx="16" ry="10" fill="#df8a52" stroke="#c9773f" stroke-width="2"/>
        </g>

        <!-- 鹈鹕 -->
        <g class="pelican">
          <path d="M 336 300 C 292 258 258 252 240 258 C 266 294 296 322 324 336 Z" fill="#f2ede2" stroke="#d8cfc0" stroke-width="2"/>
          <ellipse cx="405" cy="315" rx="80" ry="68" fill="#fff" stroke="#e0d9cc" stroke-width="2.5"/>
          <path d="M 446 262 C 466 236 478 214 468 178" fill="none" stroke="#fff" stroke-width="24" stroke-linecap="round"/>
          <ellipse cx="470" cy="172" rx="26" ry="23" fill="#fff" stroke="#e0d9cc" stroke-width="2"/>
          <g stroke="#f0ead9" stroke-width="3.5" stroke-linecap="round" fill="none">
            <line x1="460" y1="152" x2="455" y2="142"/>
            <line x1="469" y1="150" x2="470" y2="139"/>
          </g>
          <circle cx="482" cy="164" r="4.5" fill="#2b2b33"/>
          <circle cx="484" cy="162" r="1.5" fill="#fff"/>
          <path d="M 492 162 Q 556 166 612 180 L 492 176 Z" fill="#ffb347" stroke="#e08b2e" stroke-width="2" stroke-linejoin="round"/>
          <path d="M 492 176 Q 524 234 612 180 Q 548 204 492 186 Z" fill="#ffc46b" stroke="#e8a64c" stroke-width="2" stroke-linejoin="round"/>
          <line x1="556" y1="176" x2="566" y2="177" stroke="#d97f1f" stroke-width="2"/>
          <g class="wing">
            <path d="M 400 263 C 434 248 474 250 494 260 C 472 271 432 276 400 268 Z" fill="#f5efe4" stroke="#d8cfc0" stroke-width="2.5"/>
            <path d="M 442 265 Q 460 269 476 264" fill="none" stroke="#d8cfc0" stroke-width="2"/>
          </g>
        </g>
      </g>
    </svg>
  </div>
</div>
</body>
</html>
