<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#eee7d8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131109" media="(prefers-color-scheme: dark)" />
    <script>
      (() => {
        let preference;
        try { preference = localStorage.getItem("agentos.theme"); } catch {}
        if (preference === "light") document.documentElement.classList.remove("dark");
        else if (preference !== "dark") {
          try {
            if (typeof window.matchMedia === "function" && window.matchMedia("(prefers-color-scheme: light)").matches) {
              document.documentElement.classList.remove("dark");
            }
          } catch {}
        }
      })();
    </script>
    <title>Anneal</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
