<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕的单车漫游 · Pelican on a Bike</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#1a1d23;
    font-family:ui-sans-system,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    padding:24px;
  }
  .frame{
    width:min(980px,96vw);
    background:#fff;
    border-radius:24px;
    overflow:hidden;
    box-shadow:0 24px 60px rgba(0,0,0,.45), 0 1px 0 rgba(255,255,255,.6) inset;
  }
  .header{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 22px 12px;
    border-bottom:1px solid #f0ede8;
    background:linear-gradient(180deg,#fff 0%, #FFFBF2 100%);
  }
  .title{
    display:flex;gap:12px;align-items:center;
  }
  .title h1{
    font-size:16px;font-weight:800;letter-spacing:0.04em;color:#1a1a1a;
  }
  .title h1 span{font-weight:400;color:#8a857e;font-size:12px;margin-left:8px;letter-spacing:0.06em}
  .badge{
    font-size:11px;font-weight:700;letter-spacing:0.08em;
    background:#111;color:#fff;padding:6px 10px;border-radius:999px;
  }
  .stage{
    position:relative;
    background:#87D8F7;
  }
  svg{display:block;width:100%;height:auto;}
  .controls{
    display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;
    padding:14px 18px 16px;background:#fff;
    border-top:1px solid #f0ede8;
  }
  .left-ctrl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .btn{
    appearance:none;border:1px solid #e8e5e0;background:#111;color:#fff;
    padding:8px 14px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;
    transition:.15s;
  }
  .btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(0,0,0,.18)}
  .btn:active{transform:translateY(0)}
  .btn.secondary{background:#fff;color:#111}
  .btn.secondary.active{background:#111;color:#fff}
  .slider-wrap{
    display:flex;align-items:center;gap:10px;
    background:#f7f5f1;border:1px solid #ece8e1;padding:6px 12px;border-radius:999px;
  }
  .slider-wrap label{font-size:12px;font-weight:700;color:#5a5752;white-space:nowrap}
  input[type="range"]{width:120px;accent-color:#0ea5a0}
  .speed-val{font-size:12px;font-variant-numeric:tabular-nums;font-weight:700;color:#111;min-width:32px;text-align:right}
  .hint{font-size:11px;color:#9a9590;line-height:1.5}
  .legend{font-size:11px;color:#8a857e;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
  @media (max-width:640px){
    .header{flex-direction:column;align-items:flex-start;gap:8px}
    input[type="range"]{width:90px}
  }
</style>
</head>
<body>
<div class="frame">
  <div class="header">
    <div class="title">
      <div style="width:36px;height:36px;border-radius:10px;background:#0ea5a0;display:grid;place-items:center;color:#fff;font-size:18px;">🚲</div>
      <h1>鹈鹕骑行记 <span>PELICAN · VELO · 2D SVG ANIMATION</span></h1>
    </div>
    <div class="badge">SVG + CSS + JS · 60FPS</div>
  </div>

  <div class="stage">
    <svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="鹈鹕骑自行车动画">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#6ECDF5"/>
          <stop offset="55%" stop-color="#A7E5FF"/>
          <stop offset="100%" stop-color="#FFF6D6"/>
        </linearGradient>
        <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#3a3f47"/>
          <stop offset="100%" stop-color="#23272e"/>
        </linearGradient>
        <linearGradient id="pelicanBody" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ffffff"/>
          <stop offset="100%" stop-color="#EEE8DD"/>
        </linearGradient>
        <linearGradient id="beakUpper" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#FF8C2B"/>
          <stop offset="100%" stop-color="#FF5A1F"/>
        </linearGradient>
        <linearGradient id="helmetGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#FF3B30"/>
          <stop offset="100%" stop-color="#C61E14"/>
        </linearGradient>
        <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
          <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.18"/>
        </filter>
        <filter id="tinyShadow" x="-50%" y="-50%" width="200%" height="200%">
          <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.2"/>
        </filter>
      </defs>

      <!-- sky -->
      <rect x="0" y="0" width="900" height="520" fill="url(#sky)"/>

      <!-- sun -->
      <g opacity="0.95">
        <circle cx="780" cy="88" r="38" fill="#FFD23F" />
        <circle cx="780" cy="88" r="52" fill="#FFD23F" opacity="0.18"/>
        <g stroke="#FFD23F" stroke-linecap="round" opacity="0.7">
          <line x1="780" y1="28" x2="780" y2="12" stroke-width="3"/>
          <line x1="822" y1="46" x2="833" y2="35" stroke-width="3"/>
          <line x1="840" y1="88" x2="856" y2="88" stroke-width="3"/>
          <line x1="822" y1="130" x2="833" y2="141" stroke-width="3"/>
        </g>
      </g>

      <!-- distant hills -->
      <path d="M -40 320 C 80 210, 180 240, 300 285 C 380 320, 470 315, 560 260 C 640 210, 730 220, 940 300 L 940 340 L -40 340 Z" fill="#2EBF8B" opacity="0.95"/>
      <path d="M -40 335 C 60 275, 150 295, 260 325 C 340 352, 520 348, 620 300 C 710 260, 800 270, 940 320 L 940 340 L -40 340 Z" fill="#1FA87A" />
      <!-- trees parallax far -->
      <g opacity="0.9" id="farTrees">
        <g fill="#104E3A">
          <path d="M 70 325 L 85 295 L 100 325 Z"/><rect x="83" y="325" width="4" height="10" fill="#3a2a16"/>
          <path d="M 560 295 L 575 265 L 590 295 Z"/><rect x="573" y="295" width="4" height="10" fill="#3a2a16"/>
          <path d="M 740 312 L 755 282 L 770 312 Z"/><rect x="753" y="312" width="4" height="10" fill="#3a2a16"/>
        </g>
      </g>

      <!-- clouds - will be moved by JS/CSS -->
      <g id="clouds">
        <!-- cloud 1 -->
        <g class="cloud" data-speed="0.25" opacity="0.95">
          <ellipse cx="120" cy="110" rx="38" ry="22" fill="#fff"/>
          <ellipse cx="145" cy="105" rx="28" ry="18" fill="#fff"/>
          <ellipse cx="95" cy="112" rx="22" ry="16" fill="#fff"/>
          <ellipse cx="118" cy="122" rx="42" ry="14" fill="#fff" opacity="0.9"/>
        </g>
        <g class="cloud" data-speed="0.45" opacity="0.92">
          <ellipse cx="360" cy="78" rx="30" ry="18" fill="#fff"/>
          <ellipse cx="380" cy="73" rx="22" ry="14" fill="#fff"/>
          <ellipse cx="340" cy="80" rx="18" ry="13" fill="#fff"/>
        </g>
        <g class="cloud" data-speed="0.18" opacity="0.9">
          <ellipse cx="620" cy="118" rx="44" ry="24" fill="#fff"/>
          <ellipse cx="650" cy="112" rx="32" ry="20" fill="#fff"/>
          <ellipse cx="592" cy="120" rx="24" ry="16" fill="#fff"/>
        </g>
        <g class="cloud" data-speed="0.35" opacity="0.88">
          <ellipse cx="860" cy="92" rx="30" ry="18" fill="#fff"/>
          <ellipse cx="880" cy="86" rx="20" ry="13" fill="#fff"/>
        </g>
      </g>

      <!-- birds far -->
      <g stroke="#2b2b2b" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.35">
        <path d="M 210 92 Q 216 86 222 92 Q 228 86 234 92"/>
        <path d="M 240 88 Q 244 83 248 88 Q 252 83 256 88" opacity="0.8"/>
      </g>

      <!-- ground / road -->
      <rect x="0" y="385" width="900" height="135" fill="url(#roadGrad)"/>
      <!-- sidewalk -->
      <rect x="0" y="385" width="900" height="14" fill="#D9D2C5"/>
      <rect x="0" y="399" width="900" height="4" fill="#B8B0A0"/>
      <!-- road dashed center line - will animate dashoffset -->
      <line id="roadLine" x1="0" y1="452" x2="900" y2="452" stroke="#fff" stroke-width="4" stroke-dasharray="28 22" stroke-linecap="round" opacity="0.95"/>
      <!-- road texture dots -->
      <g fill="#fff" opacity="0.06">
        <circle cx="120" cy="430" r="1.5"/><circle cx="340" cy="468" r="1.2"/><circle cx="680" cy="438" r="1.3"/>
      </g>
      <!-- side bushes -->
      <g id="bushes">
        <ellipse cx="70" cy="390" rx="22" ry="12" fill="#1FA87A"/>
        <ellipse cx="82" cy="386" rx="14" ry="9" fill="#2EBF8B"/>
        <ellipse cx="840" cy="388" rx="26" ry="13" fill="#1FA87A"/>
        <ellipse cx="825" cy="384" rx="16" ry="10" fill="#2EBF8B"/>
      </g>

      <!-- moving ground trees / poles parallax - separate layer for motion -->
      <g id="parallaxGround" opacity="1">
        <!-- telegraph pole that scrolls -->
        <g class="pole" data-speed="1.2">
          <rect x="0" y="220" width="8" height="170" rx="2" fill="#4a3a2a"/>
          <rect x="-6" y="238" width="20" height="4" rx="2" fill="#4a3a2a"/>
          <rect x="-6" y="258" width="20" height="4" rx="2" fill="#4a3a2a"/>
          <ellipse cx="4" cy="392" rx="10" ry="4" fill="#000" opacity="0.15"/>
        </g>
      </g>

      <!-- shadow under bike -->
      <ellipse id="bikeShadow" cx="390" cy="412" rx="108" ry="14" fill="#000" opacity="0.18"/>

      <!-- ================= BICYCLE + PELICAN GROUP ================= -->
      <!-- This whole group bobs slightly -->
      <g id="riderGroup" filter="url(#softShadow)">
        <!-- bicycle -->
        <g id="bicycle">
          <!-- wheels -->
          <!-- rear wheel -->
          <g id="rearWheel" transform="translate(300,410)">
            <circle r="54" fill="none" stroke="#1a1d23" stroke-width="7"/>
            <circle r="48" fill="none" stroke="#2a2f38" stroke-width="1.5" opacity="0.9"/>
            <circle r="3" fill="#111"/>
            <!-- spokes group that rotates -->
            <g id="rearSpokes" stroke="#cbd5e1" stroke-width="1.4" stroke-linecap="round" opacity="0.95">
              <!-- 6 spokes -->
              <line x1="0" y1="0" x2="0" y2="-46"/><line x1="0" y1="0" x2="40" y2="-23"/><line x1="0" y1="0" x2="40" y2="23"/>
              <line x1="0" y1="0" x2="0" y2="46"/><line x1="0" y1="0" x2="-40" y2="23"/><line x1="0" y1="0" x2="-40" y2="-23"/>
              <!-- second set rotated 30deg -->
              <g opacity="0.55">
                <line x1="0" y1="0" x2="23" y2="-40"/><line x1="0" y1="0" x2="46" y2="0"/><line x1="0" y1="0" x2="23" y2="40"/>
                <line x1="0" y1="0" x2="-23" y2="40"/><line x1="0" y1="0" x2="-46" y2="0"/><line x1="0" y1="0" x2="-23" y2="-40"/>
              </g>
            </g>
            <circle r="8" fill="#e8e5e0" stroke="#111" stroke-width="1.2"/>
          </g>
          <!-- front wheel -->
          <g id="frontWheel" transform="translate(500,410)">
            <circle r="54" fill="none" stroke="#1a1d23" stroke-width="7"/>
            <circle r="48" fill="none" stroke="#2a2f38" stroke-width="1.5" opacity="0.9"/>
            <circle r="3" fill="#111"/>
            <g id="frontSpokes" stroke="#cbd5e1" stroke-width="1.4" stroke-linecap="round" opacity="0.95">
              <line x1="0" y1="0" x2="0" y2="-46"/><line x1="0" y1="0" x2="40" y2="-23"/><line x1="0" y1="0" x2="40" y2="23"/>
              <line x1="0" y1="0" x2="0" y2="46"/><line x1="0" y1="0" x2="-40" y2="23"/><line x1="0" y1="0" x2="-40" y2="-23"/>
              <g opacity="0.55">
                <line x1="0" y1="0" x2="23" y2="-40"/><line x1="0" y1="0" x2="46" y2="0"/><line x1="0" y1="0" x2="23" y2="40"/>
                <line x1="0" y1="0" x2="-23" y2="40"/><line x1="0" y1="0" x2="-46" y2="0"/><line x1="0" y1="0" x2="-23" y2="-40"/>
              </g>
            </g>
            <circle r="8" fill="#e8e5e0" stroke="#111" stroke-width="1.2"/>
            <!-- front fender -->
            <path d="M -48 -18 A 58 58 0 0 1 20 -54" fill="none" stroke="#0ea5a0" stroke-width="6" stroke-linecap="round" opacity="0.95"/>
          </g>

          <!-- bike frame -->
          <g id="frame" stroke-linecap="round" stroke-linejoin="round" fill="none">
            <!-- chain stay rear to bottom bracket -->
            <line x1="300" y1="410" x2="384" y2="410" stroke="#0ea5a0" stroke-width="8"/>
            <!-- seat tube -->
            <line x1="340" y1="330" x2="384" y2="410" stroke="#14b8a6" stroke-width="9"/>
            <!-- top tube -->
            <line x1="340" y1="332" x2="462" y2="338" stroke="#0ea5a0" stroke-width="8"/>
            <!-- down tube -->
            <line x1="384" y1="410" x2="462" y2="338" stroke="#0f766e" stroke-width="9"/>
            <!-- fork -->
            <line x1="500" y1="410" x2="468" y2="342" stroke="#111827" stroke-width="7"/>
            <line x1="500" y1="410" x2="476" y2="342" stroke="#374151" stroke-width="3" opacity="0.9"/>
            <!-- seat stays -->
            <line x1="300" y1="410" x2="340" y2="330" stroke="#0ea5a0" stroke-width="6"/>
            <!-- handlebar stem -->
            <line x1="468" y1="342" x2="482" y2="318" stroke="#111827" stroke-width="7"/>
          </g>
          <!-- chain ring & chain -->
          <ellipse cx="384" cy="410" rx="28" ry="28" fill="none" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.5"/>
          <circle cx="384" cy="410" r="16" fill="#d1d5db" stroke="#111" stroke-width="1.5"/>
          <circle cx="384" cy="410" r="4" fill="#111"/>
          <!-- chain line -->
          <path id="chainPath" d="M 384 384 L 300 395 L 300 425 L 384 436 Z" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4" opacity="0.7"/>
          <!-- seat -->
          <g transform="translate(332,324)">
            <path d="M -28 4 C -22 -8, -2 -12, 16 -6 L 22 0 L -20 8 Z" fill="#111827" stroke="#000" stroke-width="1.2"/>
            <rect x="-6" y="4" width="6" height="12" rx="2" fill="#6b7280"/>
          </g>
          <!-- handlebar -->
          <g transform="translate(490,318)">
            <rect x="-14" y="-6" width="28" height="8" rx="4" fill="#111827"/>
            <circle cx="-16" cy="0" r="7" fill="#1f2937" stroke="#000" stroke-width="1"/>
            <circle cx="16" cy="0" r="7" fill="#1f2937" stroke="#000" stroke-width="1"/>
            <!-- bell -->
            <circle cx="6" cy="-10" r="7" fill="#FFD23F" stroke="#b45309" stroke-width="1.2"/>
            <circle cx="6" cy="-10" r="2" fill="#fff" opacity="0.8"/>
          </g>
          <!-- pedals / crank -->
          <g id="crank" transform="translate(384,410)">
            <!-- crank arms -->
            <g id="crankArms">
              <line id="crankLeft" x1="0" y1="0" x2="0" y2="-26" stroke="#111" stroke-width="8" stroke-linecap="round"/>
              <line id="crankRight" x1="0" y1="0" x2="0" y2="26" stroke="#111" stroke-width="8" stroke-linecap="round" opacity="0.95"/>
            </g>
            <!-- pedals -->
            <g id="pedalLeft" transform="translate(0,-26)">
              <rect x="-14" y="-5" width="28" height="10" rx="3" fill="#111827" stroke="#000" stroke-width="1"/>
              <rect x="-12" y="-3" width="24" height="2" rx="1" fill="#FFD23F" opacity="0.9"/>
            </g>
            <g id="pedalRight" transform="translate(0,26)">
              <rect x="-14" y="-5" width="28" height="10" rx="3" fill="#111827" stroke="#000" stroke-width="1"/>
              <rect x="-12" y="-3" width="24" height="2" rx="1" fill="#FFD23F" opacity="0.9"/>
            </g>
          </g>
          <!-- basket front -->
          <g transform="translate(512,348)" filter="url(#tinyShadow)">
            <path d="M -22 -14 L 22 -14 L 16 18 L -16 18 Z" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
            <line x1="-14" y1="-6" x2="-10" y2="16" stroke="#d97706" stroke-width="1" opacity="0.6"/>
            <line x1="-4" y1="-8" x2="-2" y2="17" stroke="#d97706" stroke-width="1" opacity="0.6"/>
            <line x1="6" y1="-9" x2="8" y2="16" stroke="#d97706" stroke-width="1" opacity="0.6"/>
            <line x1="-18" y1="2" x2="18" y2="2" stroke="#d97706" stroke-width="1" opacity="0.5"/>
            <!-- fish in basket -->
            <g transform="translate(0,2)">
              <ellipse cx="0" cy="0" rx="14" ry="7" fill="#38bdf8" stroke="#0c4a6e" stroke-width="1.1"/>
              <path d="M -14 0 L -20 -6 L -20 6 Z" fill="#38bdf8" stroke="#0c4a6e" stroke-width="1.1"/>
              <circle cx="6" cy="-2" r="1.8" fill="#0c4a6e"/><circle cx="6.6" cy="-2.4" r="0.6" fill="#fff"/>
              <path d="M 2 3 Q 5 5 8 3" stroke="#0c4a6e" stroke-width="0.8" fill="none" stroke-linecap="round"/>
            </g>
          </g>
        </g>

        <!-- PELICAN -->
        <g id="pelican">
          <!-- legs (behind body) -->
          <g id="legs" stroke-linecap="round" stroke-linejoin="round">
            <!-- right leg (far) -->
            <g id="legR" opacity="0.95">
              <path id="thighR" d="" stroke="#FF8C2B" stroke-width="7" fill="none"/>
              <path id="shinR" d="" stroke="#FF8C2B" stroke-width="6" fill="none"/>
              <path id="footR" d="" fill="#FF5A1F" stroke="#9a3412" stroke-width="1.1"/>
            </g>
            <!-- left leg (near) -->
            <g id="legL">
              <path id="thighL" d="" stroke="#FF8C2B" stroke-width="7.5" fill="none"/>
              <path id="shinL" d="" stroke="#FF6B1A" stroke-width="6.5" fill="none"/>
              <path id="footL" d="" fill="#FF5A1F" stroke="#7c2d12" stroke-width="1.2"/>
            </g>
          </g>

          <!-- body -->
          <g id="pelicanBodyGroup" transform="translate(342,312)">
            <!-- tail -->
            <path d="M -44 -6 C -62 -10, -70 6, -52 14 L -38 6 Z" fill="#e7e0d3" stroke="#c9bfad" stroke-width="1.2"/>
            <path d="M -50 -2 L -64 2 L -50 6" fill="#d6cfbf" stroke="#c9bfad" stroke-width="1"/>
            <!-- body ellipse -->
            <ellipse cx="0" cy="0" rx="56" ry="40" fill="url(#pelicanBody)" stroke="#ddd6c7" stroke-width="1.4"/>
            <!-- belly highlight -->
            <ellipse cx="6" cy="12" rx="28" ry="14" fill="#fff" opacity="0.55"/>
            <!-- wing (will flap) -->
            <g id="wing" transform="translate(4, -6)">
              <path id="wingPath" d="M -18 -12 C -8 -28, 22 -30, 34 -10 C 38 2, 28 18, 10 18 C -6 18, -22 6, -18 -12 Z" fill="#ffffff" stroke="#ddd6c7" stroke-width="1.3"/>
              <!-- wing detail feathers -->
              <path d="M -10 -8 C 0 -18, 14 -20, 24 -14" fill="none" stroke="#e5ddd0" stroke-width="1.2" stroke-linecap="round"/>
              <path d="M -12 0 C -2 -8, 12 -10, 22 -4" fill="none" stroke="#e5ddd0" stroke-width="1.2" stroke-linecap="round"/>
              <!-- wing tip dark -->
              <path d="M 18 -14 C 28 -12, 34 -6, 30 2 L 22 6 C 26 -2, 22 -10, 18 -14 Z" fill="#2a2f38"/>
              <path d="M 14 -16 C 22 -14, 30 -8, 26 0 L 20 2 C 24 -6, 18 -12, 14 -16 Z" fill="#3a404c"/>
            </g>
            <!-- arm / handle grip -->
            <g transform="translate(46, -18)">
              <path d="M 0 0 C 12 6, 22 12, 38 10" stroke="#FF8C2B" stroke-width="7" stroke-linecap="round" fill="none"/>
              <!-- glove -->
              <ellipse cx="42" cy="10" rx="9" ry="7" fill="#111827" stroke="#000" stroke-width="1"/>
              <rect x="36" y="8" width="10" height="6" rx="2" fill="#FFD23F" opacity="0.9"/>
            </g>
          </g>

          <!-- neck -->
          <path id="neck" d="M 378 288 C 392 268, 398 240, 404 218" stroke="#ffffff" stroke-width="22" stroke-linecap="round" fill="none"/>
          <path id="neckShadow" d="M 378 288 C 392 268, 398 240, 404 218" stroke="#e8e0d1" stroke-width="22" stroke-linecap="round" fill="none" opacity="0.0"/>
          <!-- neck highlight -->
          <path d="M 384 282 C 394 264, 400 242, 406 222" stroke="#fff" stroke-width="9" stroke-linecap="round" opacity="0.35"/>

          <!-- head group -->
          <g id="headGroup" transform="translate(418, 208)">
            <!-- pouch / throat -->
            <path id="pouch" d="M -18 10 C -22 24, -6 38, 18 30 C 28 26, 34 18, 30 8 L -10 4 Z" fill="#FFB38A" stroke="#e07a4a" stroke-width="1.2"/>
            <path d="M -10 10 C -4 18, 8 22, 18 16" fill="none" stroke="#e07a4a" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
            <!-- head -->
            <ellipse cx="0" cy="0" rx="26" ry="22" fill="#ffffff" stroke="#ddd6c7" stroke-width="1.3"/>
            <!-- eye white -->
            <ellipse cx="6" cy="-4" rx="9" ry="10" fill="#fff" stroke="#ddd6c7" stroke-width="1"/>
            <!-- eye -->
            <g id="eye">
              <ellipse cx="7" cy="-2" rx="6.5" ry="7.2" fill="#0f172a"/>
              <circle cx="8.5" cy="-4.5" r="2.2" fill="#fff" opacity="0.95"/>
              <circle cx="5.2" cy="-0.5" r="1.1" fill="#38bdf8" opacity="0.9"/>
              <circle cx="7" cy="-2" r="1.0" fill="#fff" opacity="0.0" id="eyeHighlight"/>
            </g>
            <!-- eyelid for blink -->
            <path id="eyelid" d="M -2 -12 Q 7 -16 16 -6" fill="#ffffff" stroke="#ddd6c7" stroke-width="0" opacity="0"/>
            <!-- helmet -->
            <g transform="translate(-2, -18)">
              <path d="M -20 -2 C -14 -18, 6 -20, 18 -8 L 14 2 C 10 -6, -6 -10, -16 2 Z" fill="url(#helmetGrad)" stroke="#7f1d1d" stroke-width="1.2"/>
              <rect x="-18" y="-2" width="36" height="4" rx="2" fill="#7f1d1d"/>
              <!-- helmet strap -->
              <path d="M -16 2 Q -8 10, 0 12 Q 8 10, 10 2" fill="none" stroke="#111" stroke-width="1.4" stroke-linecap="round"/>
              <!-- helmet shine -->
              <ellipse cx="-6" cy="-10" rx="7" ry="4" fill="#fff" opacity="0.22"/>
            </g>
            <!-- beak upper -->
            <path id="beakUpperPath" d="M 16 -6 C 58 -10, 92 -8, 108 4 C 112 7, 110 12, 104 14 C 84 20, 52 14, 18 8 Z" fill="url(#beakUpper)" stroke="#9a3412" stroke-width="1.3" stroke-linejoin="round"/>
            <!-- nostril -->
            <ellipse cx="28" cy="0" rx="2.2" ry="1.2" fill="#7c2d12" opacity="0.8"/>
            <!-- beak lower -->
            <path id="beakLowerPath" d="M 18 8 C 52 14, 84 20, 104 14 C 104 14, 84 22, 52 20 C 30 19, 12 14, -10 10 Z" fill="#FF9F2B" stroke="#9a3412" stroke-width="1.2" stroke-linejoin="round"/>
            <!-- beak tip -->
            <path d="M 104 14 C 108 12, 110 10, 108 6 C 102 9, 96 11, 90 12 Z" fill="#7c2d12" opacity="0.9"/>
            <!-- cheek blush -->
            <ellipse cx="-8" cy="8" rx="6" ry="3.5" fill="#ff8a80" opacity="0.22"/>
          </g>

          <!-- handlebar grip line to show pelican holding -->
          <line x1="460" y1="326" x2="490" y2="318" stroke="#111" stroke-width="1" opacity="0.08"/>
        </g>
      </g>

      <!-- speed lines -->
      <g id="speedLines" stroke="#fff" stroke-linecap="round" opacity="0.45">
        <line x1="120" y1="360" x2="170" y2="360" stroke-width="2.5"/>
        <line x1="90" y1="376" x2="150" y2="376" stroke-width="2"/>
        <line x1="140" y1="344" x2="180" y2="344" stroke-width="1.6" opacity="0.6"/>
        <line x1="620" y1="352" x2="660" y2="352" stroke-width="1.8" opacity="0.5"/>
      </g>

      <!-- dust from wheels -->
      <g id="dust" opacity="0.5">
        <ellipse cx="260" cy="418" rx="14" ry="4" fill="#c9b99a" opacity="0.35"/>
        <ellipse cx="240" cy="420" rx="8" ry="3" fill="#c9b99a" opacity="0.22"/>
      </g>
    </svg>
  </div>

  <div class="controls">
    <div class="left-ctrl">
      <button class="btn" id="playBtn">⏸ 暂停</button>
      <button class="btn secondary" id="bellBtn">🔔 叮铃</button>
      <div class="slider-wrap">
        <label for="speed">速度</label>
        <input id="speed" type="range" min="0.2" max="2.2" step="0.1" value="1.0">
        <span class="speed-val" id="speedVal">1.0×</span>
      </div>
      <button class="btn secondary" id="fishBtn">🐟 小鱼</button>
    </div>
    <div class="legend">
      <span><i class="dot" style="background:#0ea5a0"></i> 车架</span>
      <span><i class="dot" style="background:#FF5A1F"></i> 鹈鹕</span>
      <span class="hint">提示：按 <b style="color:#111">空格</b> 暂停 · <b style="color:#111">B</b> 按铃</span>
    </div>
  </div>
</div>

<script>
(function(){
  const $ = s => document.querySelector(s);
  const rearSpokes = $('#rearSpokes');
  const frontSpokes = $('#frontSpokes');
  const crank = $('#crank');
  const riderGroup = $('#riderGroup');
  const wing = $('#wing');
  const headGroup = $('#headGroup');
  const neck = $('#neck');
  const pouch = $('#pouch');
  const eyelid = $('#eyelid');
  const eye = $('#eye');
  const roadLine = $('#roadLine');
  const bikeShadow = $('#bikeShadow');
  const dust = $('#dust');
  const speedLines = $('#speedLines');
  const clouds = document.querySelectorAll('.cloud');
  const pole = document.querySelector('.pole');
  const chainPath = $('#chainPath');
  let t = 0;
  let speed = 1.0;
  let paused = false;
  let bellRinging = false;
  let fishWiggle = 0;

  const hipL = {x: 346, y: 332};
  const hipR = {x: 342, y: 334};
  const bb = {x: 384, y: 410};
  const crankRadius = 26;

  function ikLeg(hip, pedal){
    const dx = pedal.x - hip.x;
    const dy = pedal.y - hip.y;
    const dist = Math.hypot(dx, dy) || 1;
    const midX = hip.x + dx*0.48;
    const midY = hip.y + dy*0.48;
    // perpendicular
    const nx = -dy / dist;
    const ny = dx / dist;
    // bend amount: more when leg is compressed, less when stretched
    const maxDist = 78;
    const bend = Math.max(0, (maxDist - dist) * 0.52) + 14;
    // knee offset to the front (positive nx)
    // choose side so knee is forward
    const side = 1;
    const kx = midX + nx * bend * side;
    const ky = midY + ny * bend * side;
    return {knee:{x:kx, y:ky}, dist};
  }

  function setLeg(legId, hip, angle){
    const px = bb.x + Math.cos(angle) * crankRadius;
    const py = bb.y + Math.sin(angle) * crankRadius;
    const {knee} = ikLeg(hip, {x:px, y:py});
    const thigh = document.getElementById('thigh'+legId);
    const shin = document.getElementById('shin'+legId);
    const foot = document.getElementById('foot'+legId);
    thigh.setAttribute('d', `M ${hip.x} ${hip.y} Q ${knee.x} ${knee.y} ${knee.x} ${knee.y} L ${knee.x} ${knee.y}`);
    // Actually straight line hip->knee
    thigh.setAttribute('d', `M ${hip.x} ${hip.y} L ${knee.x} ${knee.y}`);
    shin.setAttribute('d', `M ${knee.x} ${knee.y} L ${px} ${py}`);
    // foot - small webbed foot on pedal
    const footAngle = Math.atan2(py - knee.y, px - knee.x);
    const fx = px, fy = py;
    // web shape
    const len = 18, wid = 9;
    const ax = Math.cos(footAngle), ay = Math.sin(footAngle);
    const px1 = fx + ax*len*0.3 - ay*wid;
    const px2 = fx + ax*len - ay*wid*0.6;
    const px3 = fx + ax*len - ay*(-wid*0.6);
    const px4 = fx + ax*len*0.3 - ay*(-wid);
    foot.setAttribute('d', `M ${fx-4} ${fy-3} L ${px1} ${fy-3 + (-ay*wid)} L ${px2} ${py+2} L ${px3} ${py+2} L ${px4} ${fy-3 + (ay*wid)} Z`.replace(/NaN/g,'0'));
    // simpler foot: ellipse rotated
    // Instead use path with fixed shape aligned to pedal horizontal when near bottom
    const pedalTilt = Math.sin(angle)*0.18;
    foot.setAttribute('transform', `translate(${px},${py}) rotate(${pedalTilt*57})`);
    // Rebuild foot path relative to 0,0
    foot.setAttribute('d', `M -10 -3 L 12 -6 L 16 0 L 12 6 L -10 4 Z`);
    // color wobble
    return {px, py, knee};
  }

  let blinkTimer = 0;
  let nextBlink = 2.8 + Math.random()*2.5;
  let isBlinking = false;
  let blinkProgress = 0;

  function updateBlink(dt){
    blinkTimer += dt;
    if(isBlinking){
      blinkProgress += dt*14;
      if(blinkProgress >= 1){
        // close then open
        if(blinkProgress < 2){
          const p = blinkProgress < 1 ? blinkProgress : 2-blinkProgress;
          // eyelid covers eye
          eyelid.setAttribute('opacity', '1');
          eyelid.setAttribute('d', `M -3 -14 Q 7 ${-16 + p*18} 16 -8 L 16 -2 L -3 -2 Z`);
          eye.setAttribute('opacity', String(1 - p*0.9));
        } else {
          isBlinking = false;
          blinkProgress = 0;
          eyelid.setAttribute('opacity','0');
          eye.setAttribute('opacity','1');
          blinkTimer = 0;
          nextBlink = 2.2 + Math.random()*3.2;
        }
      } else {
        const p = blinkProgress;
        eyelid.setAttribute('opacity','1');
        eyelid.setAttribute('d', `M -3 -14 Q 7 ${-16 + p*18} 16 -8 L 16 -2 L -3 -2 Z`);
        eye.setAttribute('opacity', String(1 - p*0.9));
      }
    } else if(blinkTimer > nextBlink){
      isBlinking = true;
      blinkProgress = 0;
    }
  }

  let cloudOffset = 0;
  let poleX = 860;
  let roadOffset = 0;

  let last = performance.now();
  function frame(now){
    const dtRaw = Math.min(0.033, (now - last)/1000);
    last = now;
    const dt = paused ? 0 : dtRaw * speed;

    t += dt;

    // wheels & crank
    const wheelAngle = (t * 320) % 360; // deg per sec
    rearSpokes.setAttribute('transform', `rotate(${wheelAngle})`);
    frontSpokes.setAttribute('transform', `rotate(${wheelAngle})`);
    const crankAngle = t * 5.2; // rad/s
    const crankDeg = crankAngle * 57.2958;
    crank.setAttribute('transform', `translate(384,410) rotate(${crankDeg})`);
    // because we rotated crank group that already includes translation, need to reset: we set transform as translate+rotate, but inner pedal offsets are relative to crank rotation
    // So we need to handle pedal positions separately for legs - legs use world coords, so compute angle directly
    // Keep crank visual rotation via transform on a wrapper
    // Fix: crank is at 384,410 already, we set rotation
    // Actually crank DOM structure: <g id="crank" transform="translate(384,410)"><g id="crankArms">...
    // So we should rotate inner group
    document.getElementById('crankArms').setAttribute('transform', `rotate(${crankDeg})`);
    document.getElementById('pedalLeft').setAttribute('transform', `translate(${Math.cos(crankAngle)*crankRadius},${Math.sin(crankAngle)*crankRadius}) rotate(${-crankDeg})`);
    document.getElementById('pedalRight').setAttribute('transform', `translate(${Math.cos(crankAngle+Math.PI)*crankRadius},${Math.sin(crankAngle+Math.PI)*crankRadius}) rotate(${-crankDeg})`);

    // legs IK
    setLeg('L', hipL, crankAngle);
    setLeg('R', hipR, crankAngle + Math.PI);

    // body bob - vertical sinus synced to pedal
    const bob = Math.sin(crankAngle*2) * 2.2;
    const sway = Math.sin(crankAngle) * 0.9;
    riderGroup.setAttribute('transform', `translate(${sway},${bob})`);

    // head bob + pouch wobble
    const headBob = Math.sin(crankAngle*2 + 0.6) * 1.6;
    const headSway = Math.sin(t*2.6) * 0.7;
    headGroup.setAttribute('transform', `translate(418,${208 + headBob}) rotate(${headSway})`);
    // neck update to follow head
    neck.setAttribute('d', `M 378 ${288+bob} C 392 ${268+bob}, 398 ${240+bob*0.5}, 418 ${218+headBob}`);
    // pouch stretch with breathing
    const pouchWob = Math.sin(t*3.2)*1.2 + Math.sin(crankAngle)*0.8;
    pouch.setAttribute('transform', `translate(0,${pouchWob*0.4}) scale(${1 + Math.sin(t*2.8)*0.012}, ${1 + Math.cos(t*3.1)*0.015})`);
    pouch.setAttribute('transform-origin', '0 10');

    // wing flap - subtle, faster when speed higher
    const flap = Math.sin(t * (3.0 + speed*1.2)) * (6 + speed*2);
    wing.setAttribute('transform', `translate(4,-6) rotate(${flap*0.55})`);
    // tweak wing path for up/down
    const wingUp = Math.sin(t*3.2) > 0;
    // small shadow pulse under bike
    const shadowScale = 1 + Math.sin(crankAngle*2)*0.04;
    bikeShadow.setAttribute('transform', `translate(390,412) scale(${shadowScale},1)`);
    bikeShadow.setAttribute('opacity', String(0.16 + Math.sin(crankAngle*2)*0.02));

    // road dash movement
    roadOffset = (roadOffset + dt*220) % 50;
    roadLine.setAttribute('stroke-dashoffset', String(roadOffset));
    // chain dash
    chainPath.setAttribute('stroke-dashoffset', String((t*120)%20));

    // clouds parallax
    clouds.forEach(c=>{
      const sp = parseFloat(c.dataset.speed) || 0.3;
      const base = parseFloat(c.dataset.baseX || '0');
      if(!c.dataset.baseX){
        const bbox = c.getBBox();
        c.dataset.baseX = bbox.x + bbox.width/2;
      }
      const offset = (t * 18 * sp) % 1000;
      c.setAttribute('transform', `translate(${-offset},${Math.sin(t*0.5+sp*10)*2})`);
      // wrap: when too far left, loop is via modulo; we translate negative
      if(offset > 900) c.setAttribute('opacity','0'); else c.setAttribute('opacity','0.92');
    });
    // pole scroll
    poleX -= dt * 120;
    if(poleX < -40) poleX = 940;
    pole.setAttribute('transform', `translate(${poleX},0)`);

    // speed lines pulse
    speedLines.setAttribute('opacity', String(0.3 + Math.sin(t*6)*0.12));
    speedLines.setAttribute('transform', `translate(${ - (t*40)%60 },0)`);

    // dust puffs
    dust.setAttribute('opacity', String(0.35 + Math.sin(t*8)*0.12));
    dust.setAttribute('transform', `translate(${Math.sin(t*7)*2},0)`);

    // fish wiggle if active
    if(fishWiggle>0){
      fishWiggle -= dt;
      const wig = Math.sin(t*18)*4;
      const fish = document.querySelector('#bicycle g:last-of-type g');
      if(fish) fish.setAttribute('transform', `translate(0,2) rotate(${wig})`);
    }

    // bell ring animation
    if(bellRinging){
      const bell = document.querySelector('g[transform="translate(490,318)"] circle:nth-of-type(1)');
      // pseudo shake head?
      headGroup.setAttribute('transform', `translate(418,${208+headBob}) rotate(${headSway + Math.sin(t*28)* (bellRinging?3:0)})`);
      // decay
      if(t - bellRinging > 0.45) bellRinging = false;
    }

    updateBlink(dtRaw); // blink independent of speed

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // controls
  const playBtn = $('#playBtn');
  const bellBtn = $('#bellBtn');
  const fishBtn = $('#fishBtn');
  const speedInput = $('#speed');
  const speedVal = $('#speedVal');

  function updatePlayLabel(){
    playBtn.textContent = paused ? '▶ 播放' : '⏸ 暂停';
  }
  playBtn.addEventListener('click', ()=>{
    paused = !paused;
    updatePlayLabel();
  });
  speedInput.addEventListener('input', e=>{
    speed = parseFloat(e.target.value);
    speedVal.textContent = speed.toFixed(1)+'×';
  });
  function ringBell(){
    bellRinging = t;
    // audio via WebAudio click
    try{
      const ctx = new (window.AudioContext||window.webkitAudioContext)();
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type='sine'; o.frequency.value=880;
      o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.22, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.5);
      o.start(); o.stop(ctx.currentTime+0.5);
      setTimeout(()=>{
        const o2 = ctx.createOscillator(); const g2 = ctx.createGain();
        o2.frequency.value=1170; o2.connect(g2); g2.connect(ctx.destination);
        g2.gain.setValueAtTime(0.18, ctx.currentTime); g2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.6);
        o2.start(); o2.stop(ctx.currentTime+0.6);
      },90);
    }catch(e){}
    bellBtn.animate([{transform:'scale(1)'},{transform:'scale(1.15)'},{transform:'scale(1)'}],{duration:220,easing:'ease-out'});
  }
  bellBtn.addEventListener('click', ringBell);
  fishBtn.addEventListener('click', ()=>{
    fishWiggle = 1.2;
    fishBtn.animate([{transform:'rotate(0deg)'},{transform:'rotate(-8deg)'},{transform:'rotate(8deg)'},{transform:'rotate(0deg)'}],{duration:400});
  });

  window.addEventListener('keydown', e=>{
    if(e.code==='Space'){ e.preventDefault(); paused=!paused; updatePlayLabel(); }
    if(e.key==='b' || e.key==='B') ringBell();
  });

  // initial leg draw
  setLeg('L', hipL, 0);
  setLeg('R', hipR, Math.PI);

  // Easter: click pelican head to make eye widen
  headGroup.style.cursor='pointer';
  headGroup.addEventListener('click', ()=>{
    eye.animate([{transform:'scale(1)'},{transform:'scale(1.25)'},{transform:'scale(1)'}],{duration:300, easing:'ease-out'});
    // quick blink
    blinkTimer = nextBlink + 1;
  });
})();
</script>
</body>
</html>
