services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agentos}
      POSTGRES_USER: ${POSTGRES_USER:-agentos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentos}
    ports:
      # Loopback only. A bare "5432:5432" publishes the database on every
      # interface this machine has, which on a laptop means every network it
      # joins — with the password from .env and no further authentication.
      - "127.0.0.1:5432:5432"
    volumes:
      - agentos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agentos_postgres_data:

