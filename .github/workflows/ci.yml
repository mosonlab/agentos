name: Linux suite (manual — NOT the merge gate)

# The merge gate is scripts/merge-gate.sh, run locally. This workflow is not a
# gate and must not be treated as one: on a private repository GitHub refuses
# branch protection and rulesets outright (HTTP 403, "Upgrade to GitHub Pro or
# make this repository public"), so no check here can ever be required.
#
# It is kept, manual-trigger only, for the one thing the local gate cannot do:
# run the suites on Linux. That is worth keeping — the first three runs of this
# file found a dbtest hardcoding a macOS-only workspace root, a 5s lock-wait
# budget that only holds on a fast machine, and a race assertion that assumed
# one of two legal winners. None of those are visible from macOS alone.
#
# Trigger it from the Actions tab, or: gh workflow run 'Linux suite (manual — NOT the merge gate)'
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  toolchain-range:
    name: Node ${{ matrix.node }} install compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20.19.0", "22.13.0", "24"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - run: npm run test:setup-local

  gate:
    name: typecheck + unit tests + dbtest
    runs-on: ubuntu-latest
    # The API dbtest suite alone runs for the better part of half an hour; this
    # is a ceiling on a hung job, not a target.
    timeout-minutes: 60

    # Ephemeral database for this job only. dbtests drop and recreate their
    # schema and the scratch-database tests create and drop whole databases,
    # so they must never see a database anybody else uses.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agentos
          POSTGRES_PASSWORD: agentos
          # Not "agentos": testdb.ts refuses that name for scratch databases.
          POSTGRES_DB: agentos_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentos -d agentos_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # A dedicated non-public schema: the dbtest harness drops and re-applies
      # whatever schema this names.
      TEST_DATABASE_URL: postgresql://agentos:agentos@localhost:5432/agentos_ci?schema=agentos_ci
      # Same server, same role, different database — the scratch-database
      # manager's preflight requires all three before it will create anything.
      TEST_DATABASE_MAINTENANCE_URL: postgresql://agentos:agentos@localhost:5432/postgres
      AGENTOS_ALLOW_SCRATCH_DATABASES: "1"

    steps:
      - uses: actions/checkout@v5
        with:
          # preflight-goal-execution.dbtest.ts asserts that a recorded master
          # SHA is present and an ancestor of HEAD, so the default shallow
          # checkout would fail it.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      # 2026-08-18 incident: a dbtest pointed at a scratch database still swept
      # the live workspace root, because the root came from a default that
      # resolved to a real path. The application-side defences landed in #108,
      # but CI sets these explicitly anyway — the point of a gate is that it
      # does not rely on the thing it is gating.
      - name: Isolate every host path the test processes could default to
        run: |
          set -euo pipefail
          for var in RUNNER_WORKSPACE_ROOT CONTROL_PLANE_STATE_DIR FILES_ROOT; do
            dir="$(mktemp -d "${RUNNER_TEMP}/${var}.XXXXXXXX")"
            chmod 700 "$dir"
            echo "${var}=${dir}" >> "$GITHUB_ENV"
            echo "${var}=${dir}"
          done

      - name: Verify the isolation took effect
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          # True when either path is the other or contains it.
          overlaps() {
            case "$1" in "$2"|"$2"/*) return 0 ;; esac
            case "$2" in "$1"|"$1"/*) return 0 ;; esac
            return 1
          }
          # The real paths the application resolves to when these variables are
          # unset: ~/.agentos/{runs,control-plane} and ~/Documents/agentos.
          # $HOME itself is not a useful check here — everything on a GitHub
          # runner, $RUNNER_TEMP included, lives under it.
          for var in RUNNER_WORKSPACE_ROOT CONTROL_PLANE_STATE_DIR FILES_ROOT; do
            dir="${!var:-}"
            [ -n "$dir" ] || fail "${var} is unset"
            [ -d "$dir" ] || fail "${var}=${dir} is not a directory"
            [ -z "$(ls -A "$dir")" ] || fail "${var}=${dir} is not empty"
            case "$dir" in "${RUNNER_TEMP}"/*) ;; *) fail "${var}=${dir} is outside ${RUNNER_TEMP}" ;; esac
            for real in "${HOME}/.agentos" "${HOME}/Documents/agentos" "${GITHUB_WORKSPACE}"; do
              if overlaps "$dir" "$real"; then fail "${var}=${dir} overlaps ${real}"; fi
            done
          done
          # The API refuses to start when the Files Root overlaps the workspace
          # root in either direction, and the ownership dbtest starts a real API.
          if overlaps "$RUNNER_WORKSPACE_ROOT" "$FILES_ROOT"; then
            fail "RUNNER_WORKSPACE_ROOT and FILES_ROOT overlap"
          fi

      - run: npm ci

      - run: npm run db:generate

      - run: npm run typecheck

      # apps/web's CSS regression test reads the built stylesheet out of
      # apps/web/dist, so the unit suite is only runnable after a build. The
      # dbtests need packages/api/dist for the same reason (they spawn the real
      # API), and their pretest hook would rebuild it anyway.
      - run: npm run build

      - name: Unit tests (all workspaces with a test script)
        run: npm run test --workspaces --if-present

      # Fresh schema before the dbtests. The harness re-applies migrations
      # itself, but doing it here fails the job on a broken migration with a
      # readable error instead of a test-suite stack trace.
      - name: Apply migrations to the CI schema
        working-directory: packages/db
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: npx prisma migrate deploy

      - name: API database tests
        run: npm run test:db -w @agentos/api
